server {
    listen 8080;
	root ./www;

    error_page 404 /error_pages/404.html;
	error_page 403 /error_pages/403.html;
    error_page 500 /error_pages/500.html;

    client_max_body_size 100;

    location /home/ {
        root ./www/html;
        allowed_methods GET POST DELETE;
        autoindex on;
        index index.html;
    }

	location /pepe {
		allowed_methods GET;
		index fih.html;
	}

    location /upload {
        root ./www/uploads;
        allowed_methods POST;
        upload_store ./www/uploads;
    }

    location /old {
        redirect /new;
    }

    location /cgi {
        root ./www/scripts;
        cgi_extension .php ./cgi-bin/php-cgi;
    }

	location / {
		autoindex off;
	}

	location /cgi {
		cgi_extension .bla ./cgi_tester;
	}

	location /directory/ {
		allowed_methods GET;
		root ./www/YoupiBanane;
		index youpi.bad_extension;
	}

	location /post_body {
		index fih.html;
		allowed_methods POST;
	}
}

# Second server on another port
server {
    listen 9090;
	root ./www;

    location / {
        root ./www/admin;
        allowed_methods GET;
    }
}
